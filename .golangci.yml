version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - misspell
    - noctx
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
    - depguard
    - forbidigo
  settings:
    depguard:
      rules:
        aggregate-pure:
          list-mode: strict
          files:
            - "**/pkg/eventsourcing/aggregate/**"
            - "**/internal/aggregateaccess/hook/**"
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/deepworx/go-utils/pkg/eventsourcing/aggregate
            - github.com/deepworx/go-utils/internal/aggregateaccess
        quickstart-domain:
          list-mode: strict
          files:
            - "**/internal/quickstart/todo/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/deepworx/go-utils/pkg/eventsourcing/aggregate
        aggregatetest-no-testing:
          list-mode: lax
          files:
            - "**/pkg/eventsourcing/aggregate/aggregatetest/**"
            - "!$test"
          deny:
            - pkg: testing
              desc: aggregatetest leaves assertions to the caller
        eventstore-no-testing:
          list-mode: lax
          files:
            - "**/pkg/eventsourcing/eventstore/*.go"
            - "!$test"
          deny:
            - pkg: testing
              desc: eventstore is linked into service binaries; return errors and leave assertions to the caller
        aggregate-access:
          list-mode: lax
          files:
            - $all
            - "!**/pkg/eventsourcing/aggregate/**"
            - "!**/pkg/eventsourcing/eventstore/**"
            - "!**/internal/aggregateaccess/**"
          deny:
            - pkg: github.com/deepworx/go-utils/internal/aggregateaccess
              desc: only eventstore and aggregatetest may reach Aggregate internals
        quickstart-app-no-pgx:
          list-mode: lax
          files:
            - "**/internal/quickstart/app/**"
            # PgReadModel is a quickstart exception; see ADR-0016.
            - "!**/internal/quickstart/app/readmodel.go"
            - "!$test"
          deny:
            - pkg: github.com/jackc/pgx/v5
              desc: the app layer stays free of pgx; see ADR-0016
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^eventstore\.NewPg
          pkg: ^github\.com/deepworx/go-utils/pkg/eventsourcing/eventstore$
          msg: wire the Postgres eventstore in the server, not the app layer; see ADR-0016
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path-except: internal/quickstart/app/
        linters:
          - forbidigo
      - path: internal/quickstart/app/.+_test\.go$
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
