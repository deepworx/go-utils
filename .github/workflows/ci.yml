name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

jobs:
  test:
    name: Test (${{ matrix.pg-image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg-image: ["postgres:15", "postgres:18"]
    env:
      GOUTILS_TEST_PG_IMAGE: ${{ matrix.pg-image }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.txt ./...

      - name: Archive coverage results
        if: matrix.pg-image == 'postgres:18'
        uses: actions/upload-artifact@v6
        with:
          name: code-coverage
          path: coverage.txt

  coverage:
    name: Coverage report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: fgrosse/go-coverage-report@v1.2
        with:
          coverage-artifact-name: code-coverage
          coverage-file-name: coverage.txt

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
